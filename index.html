<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8b5b28">
  <meta name="application-name" content="Gia phả họ Nguyễn">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gia phả Nguyễn">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>GIA PHẢ HỌ NGUYỄN</title>
  <!-- Fix OneSignal service-worker paths for GitHub Pages project path: /gia-pha-ho-nguyen-v2/ -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <style>
    html,body{margin:0;width:100%;height:100%;min-height:100%;background:#fff;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;height:100svh;background:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
    iframe{display:block;border:0;width:100%;height:100%;min-height:0;background:#fff;touch-action:pan-x pan-y}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:2}
    #loadingBox{text-align:center;color:#8b5b28;padding:24px}
    #loading img{width:88px;height:88px;border-radius:18px;display:block;margin:0 auto 16px}
    #loading strong{display:block;font-size:18px;margin-bottom:8px}
    #loading span{font-size:13px;color:#666}
    #error{display:none;position:fixed;inset:0;background:#fff;z-index:3;padding:28px;box-sizing:border-box}
    #error h2{margin:0 0 12px;color:#8b5b28}
    #error p{line-height:1.55;color:#444}
    #error code{display:block;word-break:break-all;background:#f3f5f7;padding:12px;border-radius:8px;font-size:12px}
    #pushSetup{display:none;position:fixed;z-index:10;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:14px;border:0;border-radius:14px;background:#9b5b12;color:#fff;font-weight:700;font-size:15px;box-shadow:0 4px 20px #0003}
  @media(max-width:767px){#loading img{width:80px;height:80px}#loadingBox{padding:20px}#loading strong{font-size:17px}}
    @media(orientation:landscape) and (max-height:520px){#loading img{width:54px;height:54px;margin-bottom:8px}#loadingBox{padding:10px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading"><div id="loadingBox"><img src="./icon-180.png" alt="Gia phả họ Nguyễn"><strong>GIA PHẢ HỌ NGUYỄN</strong><span>Đang mở ứng dụng…</span></div></div>
  <div id="pushStatus" role="status" aria-live="polite" style="display:none;position:fixed;z-index:11;left:16px;right:16px;bottom:calc(82px + env(safe-area-inset-bottom,0px));padding:12px 14px;border:1px solid #d8b77f;border-radius:12px;background:#fffaf0;color:#563716;font:600 14px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;box-shadow:0 4px 18px #0002;word-break:break-word"></div>
  <button id="pushSetup" type="button">Bật thông báo đẩy trên điện thoại</button>
  <div id="error"><h2>Chưa cấu hình Web App</h2><p>Mở <b>config.js</b> và kiểm tra URL Apps Script kết thúc bằng <b>/exec</b>.</p><code>APP_URL = "https://script.google.com/macros/s/.../exec"</code></div>
  <script src="./config.js"></script>
  <script>
    (function(){
      var url=window.GIA_PHA_CONFIG&&window.GIA_PHA_CONFIG.APP_URL;
      if(!url||!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){
        document.getElementById('loading').style.display='none';
        document.getElementById('error').style.display='block';return;
      }
      var frame=document.createElement('iframe');frame.src=url;frame.title='GIA PHẢ HỌ NGUYỄN';
      frame.allow='clipboard-read; clipboard-write';frame.setAttribute('referrerpolicy','no-referrer-when-downgrade');
      frame.onload=function(){document.getElementById('loading').style.display='none';};
      document.getElementById('app').appendChild(frame);
    })();
    (function(){
      var cfg=window.GIA_PHA_CONFIG||{}, oneSignalReady=null, oneSignalScriptAdded=false, activeUserId='', activeAppWindow=null, pushActivationInProgress=false, pushAttemptId=0;
      function withTimeout(promise,ms,label){var timer;return Promise.race([Promise.resolve(promise),new Promise(function(_,reject){timer=setTimeout(function(){reject(new Error(label||('Hết thời gian chờ sau '+Math.round(ms/1000)+' giây.')));},ms);})]).finally(function(){clearTimeout(timer);});}
      function replyToApp(target,payload){var source=target&&target.source?target.source:target;if(!source||typeof source.postMessage!=='function')return false;var origin=target&&typeof target.origin==='string'?target.origin:'';if(origin!=='https://script.google.com'&&!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(origin))return false;try{source.postMessage(payload,origin);return true;}catch(e){return false;}}
      function loadOneSignal(){if(!cfg.ONESIGNAL_APP_ID)return Promise.reject(new Error('Chưa cấu hình ONESIGNAL_APP_ID trong config.js'));if(window.OneSignal&&window.OneSignal.Notifications)return Promise.resolve(window.OneSignal);if(oneSignalReady)return oneSignalReady;oneSignalReady=withTimeout(new Promise(function(resolve,reject){var settled=false;function done(fn,value){if(settled)return;settled=true;fn(value);}window.OneSignalDeferred=window.OneSignalDeferred||[];window.OneSignalDeferred.push(async function(OS){try{await OS.init({appId:cfg.ONESIGNAL_APP_ID,serviceWorkerPath:'/gia-pha-ho-nguyen-v2/onesignal/OneSignalSDKWorker.js',serviceWorkerUpdaterPath:'/gia-pha-ho-nguyen-v2/onesignal/OneSignalSDKUpdaterWorker.js',serviceWorkerParam:{scope:'/gia-pha-ho-nguyen-v2/onesignal/'}});window.OneSignal=OS;done(resolve,OS);}catch(e){done(reject,e);}});if(!oneSignalScriptAdded){oneSignalScriptAdded=true;var sc=document.createElement('script');sc.src='https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';sc.defer=true;sc.onerror=function(){oneSignalScriptAdded=false;done(reject,new Error('Không tải được OneSignal SDK. Kiểm tra mạng và thử lại.'));};document.head.appendChild(sc);}}),15000,'OneSignal không phản hồi trong 15 giây. Kiểm tra kết nối mạng, cấu hình App ID và Service Worker.').catch(function(e){oneSignalReady=null;throw e;});return oneSignalReady;}
      var pushBtn=document.getElementById('pushSetup');
      var pushStatus=document.getElementById('pushStatus');
      function showPushStatus(message){pushStatus.textContent=message;pushStatus.style.display='block';}
      function hidePushStatus(){pushStatus.textContent='';pushStatus.style.display='none';}
      function waitForSubscription(OS,timeoutMs){return new Promise(function(resolve){var start=Date.now();(function check(){var ps=OS&&OS.User&&OS.User.PushSubscription;var id=ps&&ps.id;var optedIn=ps&&ps.optedIn;if(id&&optedIn){resolve({id:id,optedIn:true});return;}if(Date.now()-start>=timeoutMs){resolve({id:id||'',optedIn:!!optedIn});return;}setTimeout(check,500);})();});}
      window.addEventListener('message',async function(ev){var f=document.querySelector('#app iframe');if(!f||!ev.data||typeof ev.data.type!=='string')return;var originOk=/^https:\/\/(script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(ev.origin||'');var fromApp=(ev.source===f.contentWindow)&&originOk;if(!fromApp)return;activeAppWindow=ev.source;try{if(ev.data.type==='GP_AUTH'){activeUserId=String(ev.data.userId||'');if(activeUserId&&cfg.ONESIGNAL_APP_ID){var OS=await loadOneSignal();await OS.login(activeUserId);}}
        else if(ev.data.type==='GP_ENABLE_PUSH'){activeUserId=String(ev.data.userId||activeUserId||'');if(!cfg.ONESIGNAL_APP_ID)throw new Error('Thiếu ONESIGNAL_APP_ID trong GITHUB_PWA/config.js. Cần tạo ứng dụng Web Push trên OneSignal và triển khai lại GitHub Pages.');pushBtn.style.display='block';pushBtn.textContent='Bật thông báo đẩy trên điện thoại';replyToApp(ev,{type:'GP_PUSH_STATUS',ok:false,pending:true,message:'Đã kết nối lớp PWA. Hãy bấm nút nổi “Bật thông báo đẩy trên điện thoại” ở cuối màn hình để cấp quyền.'});}
        else if(ev.data.type==='GP_LOGOUT'){activeUserId='';if(!pushActivationInProgress){pushBtn.style.display='none';hidePushStatus();}if(window.OneSignal&&window.OneSignal.logout)await window.OneSignal.logout();}
      }catch(err){replyToApp(ev,{type:'GP_PUSH_STATUS',ok:false,message:String(err&&err.message||err)});}});
      // Khởi tạo OneSignal trước thao tác người dùng. Không tải SDK hoặc chờ đăng nhập
      // trước requestPermission(), vì iOS yêu cầu lời gọi quyền xuất phát trực tiếp từ click.
      var oneSignalWarmup=loadOneSignal().then(function(OS){return OS;}).catch(function(err){
        showPushStatus('Chưa khởi tạo được OneSignal: '+String(err&&err.message||err)+' Bạn vẫn có thể bấm thử lại.');
        return null;
      });
      pushBtn.addEventListener('click',async function(){
        if(pushActivationInProgress)return;
        var thisAttempt=++pushAttemptId;
        var OS=window.OneSignal;
        if(!OS||!OS.Notifications){
          showPushStatus('OneSignal chưa sẵn sàng. Hãy tải lại trang, chờ vài giây rồi bấm lại để thao tác cấp quyền được ghi nhận đúng.');
          oneSignalWarmup=loadOneSignal().catch(function(){return null;});
          return;
        }
        if(!OS.Notifications.isPushSupported()){
          showPushStatus('Thiết bị/trình duyệt chưa hỗ trợ Web Push. Trên iPhone/iPad cần iOS/iPadOS 16.4 trở lên và mở bản Gia phả đã Thêm vào Màn hình chính.');
          return;
        }
        // Gọi requestPermission ngay trong nhánh click, trước mọi await/đăng nhập bất đồng bộ.
        var permissionRequest;
        try{ permissionRequest=OS.Notifications.requestPermission(); }
        catch(e){ showPushStatus('Không thể mở yêu cầu quyền thông báo: '+String(e&&e.message||e)); return; }
        pushActivationInProgress=true;pushBtn.style.display='block';pushBtn.disabled=true;pushBtn.textContent='Đang bật thông báo…';
        showPushStatus('Đang chờ bạn cấp quyền thông báo trên thiết bị…');
        try{
          await withTimeout(permissionRequest,20000,'Yêu cầu quyền thông báo quá thời gian chờ. Kiểm tra cài đặt quyền trên iPhone.');
          if(thisAttempt!==pushAttemptId)return;
          var permission=OS.Notifications.permissionNative;
          if(permission!=='granted')throw new Error(permission==='denied'?'Quyền thông báo đang bị từ chối. Hãy bật lại trong cài đặt thông báo của ứng dụng web.':'Chưa cấp quyền thông báo. Hãy thử lại từ ứng dụng web đã thêm vào Màn hình chính.');
          if(activeUserId)await withTimeout(OS.login(activeUserId),10000,'OneSignal đăng nhập người dùng quá thời gian chờ.');
          if(!OS.User||!OS.User.PushSubscription)throw new Error('Đã cấp quyền nhưng OneSignal chưa tạo Push Subscription. Kiểm tra Service Worker và đăng ký dịch vụ.');
          showPushStatus('Đã cấp quyền. Đang đăng ký thiết bị với OneSignal…');
          await withTimeout(OS.User.PushSubscription.optIn(),12000,'OneSignal chưa hoàn tất đăng ký thiết bị trong 12 giây.');
          var result=await waitForSubscription(OS,10000);
          if(!result.id||!result.optedIn)throw new Error('Đã cấp quyền nhưng OneSignal chưa xác nhận đăng ký thiết bị. Kiểm tra Audience → Subscriptions trong OneSignal.');
          showPushStatus('ĐÃ ĐĂNG KÝ THÀNH CÔNG. Push Subscription ID: '+result.id);
          pushBtn.textContent='Thông báo đẩy đã bật';pushBtn.style.display='block';pushBtn.disabled=true;
          pushActivationInProgress=false;replyToApp(activeAppWindow,{type:'GP_PUSH_STATUS',ok:true,subscriptionId:result.id,message:'Đã đăng ký nhận thông báo đẩy trên thiết bị.'});
        }catch(err){
          var msg=String(err&&err.message||err);pushActivationInProgress=false;showPushStatus('Chưa hoàn tất: '+msg);pushBtn.style.display='block';pushBtn.textContent='Thử bật thông báo lại';pushBtn.disabled=false;
          replyToApp(activeAppWindow,{type:'GP_PUSH_STATUS',ok:false,message:msg});
        }
      });
    })();
    if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).catch(function(err){console.warn('PWA service worker registration failed:',err);});});}
  </script>
</body></html>
