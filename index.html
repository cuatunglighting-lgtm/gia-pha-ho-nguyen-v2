<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8b5b28">
  <meta name="application-name" content="Gia phả họ Nguyễn">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gia phả Nguyễn">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>GIA PHẢ HỌ NGUYỄN</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <style>
    html,body{margin:0;width:100%;height:100%;min-height:100%;background:#fff;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;height:100svh;background:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
    iframe{display:block;border:0;width:100%;height:100%;min-height:0;background:#fff;touch-action:pan-x pan-y}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:2}
    #loadingBox{text-align:center;color:#8b5b28;padding:24px}
    #loading img{width:88px;height:88px;border-radius:18px;display:block;margin:0 auto 16px}
    #loading strong{display:block;font-size:18px;margin-bottom:8px}
    #loading span{font-size:13px;color:#666}
    #error{display:none;position:fixed;inset:0;background:#fff;z-index:3;padding:28px;box-sizing:border-box}
    #error h2{margin:0 0 12px;color:#8b5b28}
    #error p{line-height:1.55;color:#444}
    #error code{display:block;word-break:break-all;background:#f3f5f7;padding:12px;border-radius:8px;font-size:12px}
    #pushSetup{display:none;position:fixed;z-index:10;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:14px;border:0;border-radius:14px;background:#9b5b12;color:#fff;font-weight:700;font-size:15px;box-shadow:0 4px 20px #0003}
  @media(max-width:767px){#loading img{width:80px;height:80px}#loadingBox{padding:20px}#loading strong{font-size:17px}}
    @media(orientation:landscape) and (max-height:520px){#loading img{width:54px;height:54px;margin-bottom:8px}#loadingBox{padding:10px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading"><div id="loadingBox"><img src="./icon-180.png" alt="Gia phả họ Nguyễn"><strong>GIA PHẢ HỌ NGUYỄN</strong><span>Đang mở ứng dụng…</span></div></div>
  <button id="pushSetup" type="button">Bật thông báo đẩy trên điện thoại</button>
  <div id="error"><h2>Chưa cấu hình Web App</h2><p>Mở <b>config.js</b> và kiểm tra URL Apps Script kết thúc bằng <b>/exec</b>.</p><code>APP_URL = "https://script.google.com/macros/s/.../exec"</code></div>
  <script src="./config.js"></script>
  <script>
    (function(){
      var url=window.GIA_PHA_CONFIG&&window.GIA_PHA_CONFIG.APP_URL;
      if(!url||!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){
        document.getElementById('loading').style.display='none';
        document.getElementById('error').style.display='block';return;
      }
      var frame=document.createElement('iframe');frame.src=url;frame.title='GIA PHẢ HỌ NGUYỄN';
      frame.allow='clipboard-read; clipboard-write';frame.setAttribute('referrerpolicy','no-referrer-when-downgrade');
      frame.onload=function(){document.getElementById('loading').style.display='none';};
      document.getElementById('app').appendChild(frame);
    })();
    (function(){
      var cfg=window.GIA_PHA_CONFIG||{}, oneSignalReady=null, activeUserId='';
      function loadOneSignal(){if(!cfg.ONESIGNAL_APP_ID)return Promise.reject(new Error('Chưa cấu hình ONESIGNAL_APP_ID trong config.js'));if(oneSignalReady)return oneSignalReady;oneSignalReady=new Promise(function(resolve,reject){window.OneSignalDeferred=window.OneSignalDeferred||[];window.OneSignalDeferred.push(async function(OS){try{await OS.init({appId:cfg.ONESIGNAL_APP_ID,serviceWorkerPath:'./OneSignalSDKWorker.js',serviceWorkerUpdaterPath:'./OneSignalSDKUpdaterWorker.js',serviceWorkerParam:{scope:new URL('./',window.location.href).pathname}});resolve(OS);}catch(e){reject(e);}});var sc=document.createElement('script');sc.src='https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';sc.defer=true;sc.onerror=function(){reject(new Error('Không tải được OneSignal SDK'));};document.head.appendChild(sc);});return oneSignalReady;}
      var pushBtn=document.getElementById('pushSetup');
      window.addEventListener('message',async function(ev){var f=document.querySelector('#app iframe');if(!f||!ev.data||typeof ev.data.type!=='string')return;var fromApp=ev.source===f.contentWindow;if(!fromApp)return;try{if(ev.data.type==='GP_AUTH'){activeUserId=String(ev.data.userId||'');if(activeUserId&&cfg.ONESIGNAL_APP_ID){var OS=await loadOneSignal();await OS.login(activeUserId);}}
        else if(ev.data.type==='GP_ENABLE_PUSH'){activeUserId=String(ev.data.userId||activeUserId||'');if(!cfg.ONESIGNAL_APP_ID)throw new Error('Thiếu ONESIGNAL_APP_ID trong GITHUB_PWA/config.js. Cần tạo ứng dụng Web Push trên OneSignal và triển khai lại GitHub Pages.');pushBtn.style.display='block';pushBtn.textContent='Bật thông báo đẩy trên điện thoại';try{f.contentWindow.postMessage({type:'GP_PUSH_STATUS',ok:false,pending:true,message:'Đã kết nối lớp PWA. Hãy bấm nút nổi “Bật thông báo đẩy trên điện thoại” ở cuối màn hình để cấp quyền.'},'*');}catch(_){}}
        else if(ev.data.type==='GP_LOGOUT'){activeUserId='';pushBtn.style.display='none';if(window.OneSignal&&window.OneSignal.logout)await window.OneSignal.logout();}
      }catch(err){try{(ev.source&&ev.source.postMessage?ev.source:f.contentWindow).postMessage({type:'GP_PUSH_STATUS',ok:false,message:String(err&&err.message||err)},'*');}catch(_){try{f.contentWindow.postMessage({type:'GP_PUSH_STATUS',ok:false,message:String(err&&err.message||err)},'*');}catch(__){}}}});
      pushBtn.addEventListener('click',async function(){var f=document.querySelector('#app iframe');pushBtn.disabled=true;try{var OS=await loadOneSignal();if(activeUserId)await OS.login(activeUserId);await OS.Notifications.requestPermission();if(OS.Notifications.permissionNative!=='granted')throw new Error('Bạn chưa cấp quyền thông báo cho ứng dụng.');if(!OS.User||!OS.User.PushSubscription)throw new Error('OneSignal chưa tạo được đối tượng đăng ký thiết bị. Kiểm tra domain, HTTPS và service worker.');await OS.User.PushSubscription.optIn();var subId=OS.User.PushSubscription.id;if(!subId)throw new Error('Đã cấp quyền nhưng chưa có Push Subscription ID. Kiểm tra Audience → Subscriptions trong OneSignal rồi thử lại.');pushBtn.style.display='none';if(f)f.contentWindow.postMessage({type:'GP_PUSH_STATUS',ok:true,subscriptionId:subId},'*');}catch(err){if(f)f.contentWindow.postMessage({type:'GP_PUSH_STATUS',ok:false,message:String(err&&err.message||err)},'*');pushBtn.style.display='block';pushBtn.textContent='Thử bật thông báo lại';}finally{pushBtn.disabled=false;}});
    })();
    if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./service-worker.js').catch(function(){});});}
  </script>
</body></html>
